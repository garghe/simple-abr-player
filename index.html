<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('sap.theme.v1');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <title>PlayProbe</title>
    <meta name="description" content="PlayProbe: play, inspect and monitor MPEG-DASH and HLS streams — stream health, SCTE-35, DRM, loudness and picture/sound alarms." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PlayProbe" />
    <!-- Link previews (LinkedIn, X, Slack, Teams, WhatsApp…). The image must be an absolute URL. -->
    <link rel="canonical" href="https://playprobe.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlayProbe" />
    <meta property="og:title" content="PlayProbe — inspect and monitor DASH &amp; HLS streams" />
    <meta property="og:description" content="Play MPEG-DASH and HLS streams in your browser and check them as they play: stream health, SCTE-35 ad markers, DRM, loudness and picture/sound alarms." />
    <meta property="og:url" content="https://playprobe.xyz/" />
    <meta property="og:image" content="https://playprobe.xyz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PlayProbe logo: inspect and monitor DASH and HLS streams" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PlayProbe — inspect and monitor DASH &amp; HLS streams" />
    <meta name="twitter:description" content="Stream health, SCTE-35, DRM, loudness and picture/sound alarms, in your browser." />
    <meta name="twitter:image" content="https://playprobe.xyz/og-image.png" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <img class="logo" src="logo.svg" alt="" width="30" height="30" />
          <span class="brand-name">PlayProbe</span>
          <a id="app-version" class="app-version" target="_blank" rel="noopener"></a>
        </div>
        <nav id="tabs" class="appnav" role="tablist" aria-label="Views"></nav>
        <div class="top-actions">
          <button type="button" id="share-btn" class="ghost" title="Copy a link that loads this stream in this view">Copy link</button>
          <button type="button" id="export-btn" class="ghost" title="Download stats, tracks, SCTE log, health, alarms and network log as JSON">Export</button>
          <button type="button" id="help-btn" class="help-btn" title="What PlayProbe does and how to use it (?)" aria-label="Open the guide">?</button>
          <button type="button" id="theme-btn" class="theme-btn"></button>
        </div>
      </div>
      <form id="load-form" class="loadbar" autocomplete="off">
        <span id="format-chip" class="format-chip" hidden></span>
        <input id="url" type="url" list="url-history" required placeholder="Paste an MPEG-DASH (.mpd) or HLS (.m3u8) URL" aria-label="Stream URL" />
        <datalist id="url-history"></datalist>
        <select id="presets" aria-label="Test streams"></select>
        <button type="button" id="drm-btn" class="chip-btn" title="DRM settings (Widevine / PlayReady / FairPlay)" aria-expanded="false"></button>
        <button type="button" id="settings-btn" class="chip-btn" title="Load settings: CORS proxy, headers, low latency" aria-label="Load settings" aria-expanded="false"></button>
        <button type="submit" class="primary probe" id="load-btn">Probe stream</button>
        <div id="view-toggle" class="view-toggle" role="group" aria-label="View"></div>
      </form>
    </header>

    <section id="settings" class="settings" hidden>
      <div class="field">
        <label for="proxy-mode">CORS proxy</label>
        <select id="proxy-mode">
          <option value="auto">Auto — retry through the local proxy on network/CORS errors</option>
          <option value="always">Always — send every request through the local proxy</option>
          <option value="off">Off — fetch directly from the browser</option>
        </select>
        <small id="proxy-status"></small>
      </div>
      <div class="field">
        <label for="headers">Custom request headers <small>(one per line, <code>Name: value</code>)</small></label>
        <textarea id="headers" rows="3" placeholder="Authorization: Bearer …&#10;X-Custom: value"></textarea>
      </div>
      <div class="field checks">
        <label><input type="checkbox" id="low-latency" /> Low-latency mode (LL-HLS / LL-DASH)</label>
        <label><input type="checkbox" id="autoplay" /> Autoplay after load</label>
      </div>
    </section>

    <section id="drm-panel" class="settings drm-panel" hidden aria-label="DRM settings"></section>

    <main class="layout">
      <section class="player-col">
        <div id="player" class="player" tabindex="-1">
          <video id="video" playsinline></video>
          <div id="ad-banner" class="ad-banner" hidden></div>
          <div id="alarm-banner" class="alarm-banner" role="status" hidden></div>
          <div class="overlay-stack">
            <div id="audio-overlay" class="audio-overlay" hidden></div>
            <div id="nerd-overlay" class="nerd-overlay" hidden></div>
          </div>
          <div id="player-message" class="player-message">
            <div>
              <strong>Load a stream to start</strong>
              <p>Paste a DASH or HLS URL above, or pick one of the test streams.</p>
            </div>
          </div>
          <div id="spinner" class="spinner" hidden></div>
          <div id="controls" class="controls"></div>
        </div>
        <div id="stream-summary" class="facts"></div>
        <div id="stage-extras" class="stage-extras"></div>
      </section>

      <div
        id="splitter"
        class="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize side panel (drag, arrow keys, double-click to reset)"
        title="Drag to resize · double-click to reset"
        tabindex="0"
      ></div>

      <aside class="stats-col">
        <div id="tab-body" class="tab-body"></div>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
